<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forgot Password | I'll BeCare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../Assets/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../Assets/forgot_password.css">
</head>
<!-- data-api: where forgot_password.php is, relative to this page.
     data-login: where "Back to login" and the final redirect go. -->
<body class="fp-body" data-api="forgot_password.php" data-login="../index.html">

  <main class="fp-card">
    <header class="fp-head">
      <img class="fp-logo" src="../Assets/Logo.png" alt="I'll BeCare">
      <h1 id="fpTitle" class="fp-title">Forgot your password?</h1>
      <p id="fpSub" class="fp-sub">Enter the email you registered with and we'll send you a 6-digit code.</p>
    </header>

    <ol class="fp-steps" aria-label="Progress">
      <li class="is-active" data-step="1"><span class="dot">1</span><span class="lbl">Email</span></li>
      <li data-step="2"><span class="dot">2</span><span class="lbl">Code</span></li>
      <li data-step="3"><span class="dot">3</span><span class="lbl">Password</span></li>
    </ol>

    <section class="fp-body-inner">
      <div id="status" class="fp-status" role="status" aria-live="polite"></div>

      <!-- STEP 1 -->
      <form id="stepEmail" class="fp-form" novalidate>
        <div class="fp-field">
          <label for="email">Registered email</label>
          <input type="email" id="email" class="fp-input" required
                 autocomplete="email" autocapitalize="off" spellcheck="false"
                 placeholder="you@example.com">
        </div>
        <button type="submit" class="fp-btn">Send code</button>
      </form>

      <!-- STEP 2 -->
      <form id="stepOtp" class="fp-form" hidden novalidate>
        <div class="fp-field">
          <label for="otp">6-digit code</label>
          <input type="text" id="otp" class="fp-input fp-otp" required
                 inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 autocomplete="one-time-code" placeholder="••••••">
        </div>
        <button type="submit" class="fp-btn">Verify code</button>
        <div class="fp-row">
          <button type="button" id="resend" class="fp-link" disabled>Resend code</button>
          <button type="button" id="changeEmail" class="fp-link">Use a different email</button>
        </div>
      </form>

      <!-- STEP 3 -->
      <form id="stepReset" class="fp-form" hidden novalidate>
        <div class="fp-field">
          <label for="pw">New password</label>
          <div class="fp-pass">
            <input type="password" id="pw" class="fp-input" required minlength="8" autocomplete="new-password">
            <button type="button" class="fp-toggle" data-target="pw" aria-label="Show password" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.6 19.6 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <small class="fp-hint">At least 8 characters.</small>
        </div>
        <div class="fp-field">
          <label for="pw2">Confirm password</label>
          <div class="fp-pass">
            <input type="password" id="pw2" class="fp-input" required minlength="8" autocomplete="new-password">
            <button type="button" class="fp-toggle" data-target="pw2" aria-label="Show password" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.7 19.7 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.6 19.6 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="fp-btn">Change password</button>
      </form>

      <noscript><p class="fp-status is-error">Please enable JavaScript to reset your password.</p></noscript>

      <a id="backLogin" class="fp-back" href="../index.html">&larr; Back to login</a>
    </section>
  </main>

  <script src="../JS/forgot_password.js"></script>
</body>
</html>
